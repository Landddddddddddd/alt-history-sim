<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>架空历史推演模拟器 · Alternate History Simulator</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2933; --muted:#667085;
    --line:#e3e8ef; --brand:#2f6df0; --brand2:#13b07a; --warn:#e8893b;
    --politics:#2f6df0; --economy:#13b07a; --military:#e5484d; --tech:#7c5cff;
    --culture:#e8893b; --diplomacy:#0ea5c4; --society:#c2417a;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .langsel{display:flex;gap:6px;align-items:center}
  .langsel select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .wrap{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .n{background:var(--brand);color:#fff;border-radius:6px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .btn.good{background:var(--brand2);color:#fff;border-color:var(--brand2)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13px}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .view{display:none}
  .view.active{display:block}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0%}
  .muted{color:var(--muted);font-size:12px}
  .node{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfcfe}
  .node .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .node .yr{font-weight:700;color:var(--brand)}
  .turn{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff}
  .turn .yr{font-size:15px;font-weight:800;color:var(--brand)}
  .turn .sum{margin:6px 0 10px;color:#344054}
  .ev{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
  .ev .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
  .ev .dom{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .ev .ttl{font-weight:700}
  .ev .loc{color:var(--muted);font-size:12px}
  .ev .sev{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .divergences{margin-top:8px;padding:8px 10px;background:#fff5ec;border:1px solid #f3d3b5;border-radius:8px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff}
  .metric{display:inline-block;min-width:34px;text-align:center;padding:2px 4px;border-radius:6px;font-weight:700}
  .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f172a;color:#cbd5e1;padding:12px;border-radius:10px;max-height:420px;overflow:auto;white-space:pre-wrap}
  .log .ok{color:#4ade80}.log .err{color:#f87171}.log .info{color:#93c5fd}
  .note{font-size:12px;color:var(--muted);background:#f0f5ff;border:1px solid #d6e4ff;border-radius:8px;padding:9px 11px;margin-top:10px}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;background:#eef2ff;color:var(--brand);font-weight:600}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:50}
  .toast.show{opacity:1}
  .checkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .checkrow label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:13px;font-weight:600}
  .checkrow input{width:auto}
  /* --- 地图：年份滑块 / 地区沿革 --- */
  .map-hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .yearbar{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .yearbar input[type=range]{flex:1;accent-color:var(--brand)}
  .yearbar strong{min-width:56px;text-align:right;color:var(--brand)}
  .histbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fbfcfe}
  .strip{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 6px}
  .strip .seg{min-width:54px;border-radius:6px;padding:4px 6px;font-size:11px;color:#fff;text-align:center;font-weight:700}
  .strip .seg.chg{box-shadow:0 0 0 2px #e5484d}
  .hist-tb th,.hist-tb td{padding:5px 8px}
  .tagchip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#fdecec;color:#e5484d;border:1px solid #f5c2c0;white-space:nowrap}
  /* --- 分支对比：分歧度高亮 --- */
  .peakbox{background:#fff5ec;border:1px solid #f3d3b5;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}
  tr.peakrow>td{background:#fff7ed}
  tr.peakrow>td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr.onsetrow>td{background:#fffbeb}
  tr.onsetrow>td:first-child{box-shadow:inset 3px 0 0 #d4a017}
  .badge.alt{background:#eef2ff;color:var(--brand);border-color:#c7d7fe}
  .divbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:52px;margin:3px 0 2px}
  .divbar>i{display:block;height:100%;background:var(--warn)}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">架空历史推演模拟器</h1>
    <div class="sub" id="appSub">自带 Key · 多语言 · 多历史节点 · 地图/趋势/分支对比</div>
  </div>
  <div class="langsel">
    <span class="muted" id="langLabel">语言</span>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>

<div class="wrap">
  <!-- ============ 左：配置面板 ============ -->
  <div>
    <!-- 1. API -->
    <div class="card">
      <h2><span class="n">1</span><span id="tApi">接入模型（自己接 Key）</span></h2>
      <label id="lApiBase">API 地址（OpenAI 兼容）</label>
      <input id="apiBase" placeholder="https://api.openai.com/v1" />
      <label id="lApiKey">API Key（仅存你本地浏览器）</label>
      <input id="apiKey" type="password" placeholder="sk-... 或留空（本地 Ollama）" />
      <div class="row">
        <div><label id="lApiModel">模型名</label><input id="apiModel" placeholder="gpt-4o-mini" /></div>
        <div><label id="lApiTemp">温度</label><input id="apiTemp" type="number" step="0.05" min="0" max="2" value="0.8" /></div>
      </div>
      <div class="row">
        <div><label id="lApiMax">最大输出 token</label><input id="apiMax" type="number" step="256" min="256" value="4096" /></div>
        <div><label id="lJson">JSON 模式</label>
          <select id="jsonMode"><option value="1" id="lJson1">开启（推荐）</option><option value="0" id="lJson0">关闭</option></select>
        </div>
      </div>
      <div class="scn-row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn sm" id="btnTest" onclick="testConn()">测试连接</button>
        <button class="btn sm ghost" id="btnFillLocal" onclick="fillLocal()">填入本地 Ollama</button>
      </div>
      <div class="checkrow">
        <label><input type="checkbox" id="optRand" /> <span id="lRand">随机事件表</span></label>
        <label><input type="checkbox" id="optAdj" /> <span id="lAdj">地缘相邻 + 地图</span></label>
      </div>
      <div class="note" id="noteKey"></div>
    </div>

    <!-- 2. 方案 -->
    <div class="card" style="margin-top:16px">
      <h2><span class="n">2</span><span id="tScn">推演方案</span></h2>
      <label id="lScnTitle">方案标题</label>
      <input id="scnTitle" placeholder="例如：如果罗马统一了地中海" />
      <div class="row">
        <div><label id="lStart">起始年份</label><input id="startYear" type="number" value="100" /></div>
        <div><label id="lEnd">结束年份</label><input id="endYear" type="number" value="1500" /></div>
        <div><label id="lStep">每步年数</label><input id="stepYears" type="number" value="50" min="1" /></div>
      </div>
      <label id="lBase">初始世界设定 / 分歧前提（Point of Divergence）</label>
      <textarea id="baseContext" placeholder="描述推演起点的真实或架空世界……"></textarea>
      <div class="muted" id="lBaseHint"></div>
    </div>

    <!-- 3. 历史节点 -->
    <div class="card" style="margin-top:16px">
      <h2><span class="n">3</span><span id="tNodes">历史节点（分歧点）</span></h2>
      <div id="nodeList"></div>
      <div class="node">
        <div class="row">
          <div style="max-width:90px"><label id="lNodeYear">年份</label><input id="nYear" type="number" placeholder="800" /></div>
          <div><label id="lNodeName">名称</label><input id="nName" placeholder="火药西传" /></div>
        </div>
        <label id="lNodeDesc">该节点触发的事件描述</label>
        <textarea id="nDesc" placeholder="当推演到达此年份时，模型必须触发并推演其连锁反应"></textarea>
        <div style="margin-top:8px"><button class="btn sm primary" id="btnAddNode" onclick="addNode()">+ 添加节点</button></div>
      </div>
      <div class="note" id="noteNodes"></div>
    </div>

    <!-- 4. 操作 -->
    <div class="card" style="margin-top:16px">
      <h2><span class="n">4</span><span id="tRun">推演控制</span></h2>
      <div class="progress"><i id="progBar"></i></div>
      <div class="muted" id="progText">尚未开始</div>
      <div class="scn-row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn primary" id="btnStart" onclick="startSim()">▶ 开始推演</button>
        <button class="btn" id="btnPause" onclick="pauseSim()" disabled>⏸ 暂停</button>
        <button class="btn" id="btnReset" onclick="resetSim()">↺ 重置</button>
      </div>
      <div class="scn-row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn sm" id="btnSave" onclick="saveScenario()">保存方案</button>
        <button class="btn sm" id="btnExport" onclick="exportJson()">导出 JSON</button>
        <button class="btn sm" id="btnImport" onclick="importJson()">导入 JSON</button>
        <button class="btn sm" id="btnReport" onclick="exportReport()">📄 导出报告</button>
        <button class="btn sm" id="presetBtn0" onclick="loadPreset(0)">示例 1</button>
        <button class="btn sm" id="presetBtn1" onclick="loadPreset(1)">示例 2</button>
        <button class="btn sm" id="presetBtn2" onclick="loadPreset(2)">示例 3</button>
      </div>
      <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px">
        <div class="muted" id="branchHint"></div>
        <div class="row" style="margin-top:6px">
          <div style="max-width:130px"><label id="lBranchN">分支数 (2-4)</label><input id="branchN" type="number" min="2" max="4" value="3" /></div>
          <div style="display:flex;align-items:flex-end"><button class="btn" id="btnBranch" onclick="runBranches()">⧉ 运行分支对比</button></div>
        </div>
        <div class="progress" style="margin-top:8px"><i id="branchBar"></i></div>
        <div class="muted" id="branchText"></div>
      </div>
    </div>
  </div>

  <!-- ============ 右：输出 ============ -->
  <div>
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-view="timeline" id="tabTimeline">时间线</div>
        <div class="tab" data-view="factions" id="tabFactions">势力</div>
        <div class="tab" data-view="map" id="tabMap">地图</div>
        <div class="tab" data-view="trend" id="tabTrend">趋势</div>
        <div class="tab" data-view="branch" id="tabBranch">分支对比</div>
        <div class="tab" data-view="raw" id="tabRaw">原始 JSON</div>
        <div class="tab" data-view="log" id="tabLog">运行日志</div>
      </div>

      <div class="view active" id="view-timeline"><div id="timeline"><div class="empty" id="tlEmpty">配置好模型与方案后，点击「开始推演」。</div></div></div>
      <div class="view" id="view-factions"><div id="factions"><div class="empty">推演开始后显示势力数值。</div></div></div>
      <div class="view" id="view-map"><div id="mapView"><div class="empty">推演开始后显示势力地图。</div></div></div>
      <div class="view" id="view-trend">
        <div class="row" style="max-width:240px;margin-bottom:8px">
          <div><label id="trendMetric">指标</label>
            <select id="trendSel" onchange="renderTrend(this.value)">
              <option value="tech" id="oTech">科技</option>
              <option value="stability" id="oStab">稳定</option>
              <option value="military" id="oMil">军力</option>
              <option value="all" id="oAll">全部叠加</option>
            </select>
          </div>
        </div>
        <div id="trendView"><div class="empty">推演后显示数值趋势。</div></div>
      </div>
      <div class="view" id="view-branch"><div id="branchView"><div class="empty">点击「运行分支对比」对同一方案多次推演并并排比较走向。</div></div></div>
      <div class="view" id="view-raw"><pre class="log" id="rawView" style="background:#0f172a;color:#cbd5e1;max-height:560px">{}</pre></div>
      <div class="view" id="view-log"><div class="log" id="logView"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none" />

<script>
/* ============================================================
   架空历史推演模拟器 v2 — 单文件纯前端
   新增：SVG 势力地图、数值趋势折线图、多分支对比、强化提示词
   （随机事件表 + 地缘相邻效应 + 强制输出 map 字段）
============================================================ */

const PALETTE=['#2f6df0','#13b07a','#e5484d','#7c5cff','#e8893b','#0ea5c4','#c2417a','#d4a017','#3f6212','#9333ea','#0891b2','#db2777'];
const REGIONS=[
  {id:'na',x:70,y:60,w:95,h:85},{id:'sa',x:120,y:205,w:80,h:110},
  {id:'we',x:315,y:95,w:70,h:60},{id:'ee',x:385,y:85,w:70,h:70},
  {id:'naf',x:315,y:165,w:95,h:50},{id:'saf',x:345,y:220,w:95,h:96},
  {id:'me',x:410,y:160,w:70,h:55},{id:'ca',x:475,y:115,w:70,h:55},
  {id:'sa2',x:505,y:170,w:72,h:55},{id:'ea',x:560,y:95,w:95,h:72},
  {id:'sea',x:560,y:172,w:82,h:55},{id:'oc',x:585,y:250,w:85,h:55}
];

/* ---------- 多语言 ---------- */

    fName:"势力",fType:"类型",fRegion:"区域",fIdeo:"意识形态",fLeader:"领导人",fGdp:"GDP",fStab:"稳定",fMil:"军力",fTech:"科技",fPop:"人口",
    connOk:"连接成功 ✓", connFail:"连接失败：", connTesting:"测试中…", imported:"已导入方案", saved:"方案已保存", reseted:"已重置",
    genFail:"本回合生成失败：", doneAll:"推演完成 ✅", paused:"已暂停", resumed:"继续推演", noApi:"请先填写 API 地址与模型名",

/* ---------- API 持久化 ---------- */
function loadApi(){
  try{ const a=JSON.parse(localStorage.getItem('ahs_api')||'{}'); Object.assign(state.api,a); }catch(e){}
  try{ const o=JSON.parse(localStorage.getItem('ahs_opt')||'null'); if(o) state.opt=o; }catch(e){}
  $('apiBase').value=state.api.base; $('apiKey').value=state.api.key; $('apiModel').value=state.api.model;
  $('apiTemp').value=state.api.temp; $('apiMax').value=state.api.max; $('jsonMode').value=state.api.json?'1':'0';
}
function saveApi(){
  state.api={base:$('apiBase').value.trim(), key:$('apiKey').value.trim(), model:$('apiModel').value.trim(),
    temp:parseFloat($('apiTemp').value)||0.8, max:parseInt($('apiMax').value)||4096, json:$('jsonMode').value==='1'};
  state.opt={rand:$('optRand').checked, adj:$('optAdj').checked};
  localStorage.setItem('ahs_api',JSON.stringify(state.api));
  localStorage.setItem('ahs_opt',JSON.stringify(state.opt));
}
function fillLocal(){ $('apiBase').value='http://localhost:11434/v1'; $('apiModel').value='qwen2.5:latest'; $('apiKey').value=''; saveApi(); toast('已填入本地 Ollama'); }

async function testConn(){
  saveApi();
  if(!state.api.base||!state.api.model){ toast(t('noApi')); return; }
  $('btnTest').textContent=t('connTesting'); $('btnTest').disabled=true;
  try{ const r = await callLLM([{role:'user',content:'回复 JSON: {"ok":true}'}], true); log('TEST '+t('connOk')+' → '+r.slice(0,80),'ok'); toast(t('connOk')); }
  catch(e){ log(t('connFail')+e.message,'err'); toast(t('connFail')+e.message); }
  finally{ $('btnTest').textContent=t('btnTest'); $('btnTest').disabled=false; }
}

/* ---------- LLM 调用 ---------- */
async function callLLM(messages, isTest){
  const cfg=state.api;
  const url=cfg.base.replace(/\/+$/,'')+'/chat/completions';
  const body={model:cfg.model, messages, temperature:cfg.temp, max_tokens:cfg.max};
  if(cfg.json && !isTest) body.response_format={type:'json_object'};
  if(isTest) body.max_tokens=64;
  const headers={'Content-Type':'application/json'};
  if(cfg.key) headers['Authorization']='Bearer '+cfg.key;
  const res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){ const txt=await res.text().catch(()=> ''); throw new Error('HTTP '+res.status+' '+txt.slice(0,200)); }
  const data=await res.json();
  return data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'';
}
function parseJSON(s){
  try{ return JSON.parse(s); }catch(e){
    const a=s.indexOf('{'), b=s.lastIndexOf('}');
    if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e2){} }
    throw new Error('JSON 解析失败');
  }
}
function buildSys(lang){
  let s=I18N[lang].sysRole.replace('{lang}',lang);
  if(state.opt.rand) s+='\n\n'+I18N[lang].extraRand;
  if(state.opt.adj) s+='\n\n'+I18N[lang].extraAdj;
  return s;
}

/* ---------- 历史节点 ---------- */
function addNode(){
  const y=parseInt($('nYear').value), n=$('nName').value.trim(), d=$('nDesc').value.trim();
  if(!y||!n){ toast('填年份和名称'); return; }
  state.scenario.nodes.push({year:y,name:n,desc:d});
  $('nYear').value=''; $('nName').value=''; $('nDesc').value='';
  renderNodes();
}
function delNode(i){ state.scenario.nodes.splice(i,1); renderNodes(); }
function renderNodes(){
  const wrap=$('nodeList'); if(!wrap) return;
  if(!state.scenario.nodes.length){ wrap.innerHTML='<div class="muted">'+t('noteNodes')+'</div>'; return; }
  wrap.innerHTML=state.scenario.nodes.map((nd,i)=>
    '<div class="node"><div class="top"><span class="yr">'+nd.year+'</span><strong>'+escapeHtml(nd.name)+'</strong>'+
    '<button class="btn sm ghost" onclick="delNode('+i+')">✕</button></div>'+
    '<div class="muted" style="margin-top:4px">'+escapeHtml(nd.desc||'')+'</div></div>').join('');
}

/* ---------- 配色 ---------- */
function ensureColors(sim, factions){
  sim.factionColors = sim.factionColors||{};
  let i=Object.keys(sim.factionColors).length;
  factions.forEach(f=>{ if(f.id && !sim.factionColors[f.id]){ sim.factionColors[f.id]=PALETTE[i%PALETTE.length]; i++; } });
}

/* ---------- 推演 ---------- */
function readScenario(){
  state.scenario={title:$('scnTitle').value.trim(), start:parseInt($('startYear').value),
    end:parseInt($('endYear').value), step:Math.max(1,parseInt($('stepYears').value)||1),
    base:$('baseContext').value.trim(), nodes:state.scenario.nodes};
}
async function startSim(){
  saveApi(); readScenario();
  if(!state.api.base||!state.api.model){ toast(t('noApi')); return; }
  if(state.sim.running) return;
  if(state.sim.turns.length===0){
    state.sim={turns:[],factions:[],year:state.scenario.start,idx:0,running:false,paused:false,factionColors:{}};
  }else{ state.sim.running=false; state.sim.paused=false; }
  state.branches=[];
  log(t('simStart').replace('{s}',state.scenario.start).replace('{e}',state.scenario.end).replace('{p}',state.scenario.step).replace('{n}',totalSteps()).replace('{l}',LANG),'info');
  setRunning(true); runLoop();
}
function pauseSim(){ if(state.sim.running){ state.sim.paused=true; setRunning(false); toast(t('paused')); } }
function resetSim(){
  state.sim={turns:[],factions:[],year:null,idx:0,running:false,paused:false,factionColors:{}};
  state.branches=[];
  state.map={year:null,region:null};
  try{ localStorage.removeItem('ahs_run'); }catch(e){}
  renderNodes(); refreshViews(); $('rawView').textContent='{}';
  $('progBar').style.width='0%'; $('progText').textContent=t('progText');
  $('branchBar').style.width='0%'; $('branchText').textContent='';
  log('↺ '+t('reseted'),'info');
}
function setRunning(on){
  state.sim.running=on;
  $('btnStart').disabled=on; $('btnPause').disabled=!on;
  $('btnStart').textContent = (state.sim.turns.length>0 && !on)? '▶ '+t('resumed') : '▶ '+t('btnStart');
}
async function runLoop(){
  while(state.sim.idx < totalSteps() && state.sim.running && !state.sim.paused){
    try{
      const turn=await genTurn(state.sim, LANG, null);
      state.sim.turns.push(turn);
      if(turn.factions&&turn.factions.length) state.sim.factions=turn.factions;
      state.sim.idx++;
      state.sim.year=state.scenario.start+state.sim.idx*state.scenario.step;
      refreshViews(); renderRaw();
      const pct=Math.round(state.sim.idx/totalSteps()*100);
      $('progBar').style.width=pct+'%';
      $('progText').textContent=state.scenario.start+(state.sim.idx-1)*state.scenario.step+' → '+state.scenario.start+state.sim.idx*state.scenario.step+'  ('+state.sim.idx+'/'+totalSteps()+')';
      log('✓ turn '+state.sim.idx+'/'+totalSteps()+' @ '+turn.year,'ok');
      saveRun();
    }catch(e){
      log(t('genFail')+e.message,'err'); state.sim.paused=true; setRunning(false); toast(t('genFail')+e.message); return;
    }
    await sleep(50);
  }
  if(state.sim.idx>=totalSteps()){ setRunning(false); log(t('doneAll'),'ok'); toast(t('doneAll')); }
}
async function genTurn(sim, lang, seedNote){
  const sys=buildSys(lang);
  const due = state.scenario.nodes.filter(nd=> nd.year <= (state.scenario.start+sim.idx*state.scenario.step) && nd.year > (state.scenario.start+(sim.idx-1)*state.scenario.step));
  let userMsg;
  if(sim.idx===0){
    userMsg = '【初始世界设定 / POD】\n'+state.scenario.base+'\n\n【已定义历史节点】\n'+
      state.scenario.nodes.map(n=>'- '+n.year+'年：'+n.name+' — '+n.desc).join('\n')+
      '\n\n请建立初始世界状态（factions 列表，至少 3 个，并给每个 faction 分配唯一 id），并推演从 '+state.scenario.start+' 年开始的第一个 '+state.scenario.step+' 年。同时输出本回合的 map（12 个地区控制）。只输出JSON。';
  }else{
    const curYear=state.scenario.start+sim.idx*state.scenario.step;
    userMsg = '【当前年份】'+(state.scenario.start+(sim.idx-1)*state.scenario.step)+'\n【当前世界状态】\n'+
      JSON.stringify({year:state.scenario.start+(sim.idx-1)*state.scenario.step, factions:sim.factions},null,1)+
      '\n\n【本回合需触发的历史节点】\n'+(due.length?due.map(n=>'- '+n.year+'年：'+n.name+' — '+n.desc).join('\n'):'（无）')+
      '\n\n请推演接下来 '+state.scenario.step+' 年（至 '+curYear+' 年），更新所有 factions 的完整最新数值与 map，保持连续性与真实性。只输出JSON。';
  }
  if(seedNote) userMsg += '\n\n【随机种子】'+seedNote+'（用于让本次推演走向与其他次不同）';
  let parsed=null;
  for(let att=0;att<3;att++){
    const content=await callLLM([{role:'system',content:sys},{role:'user',content:userMsg}], false);
    try{ parsed=parseJSON(content); break; }
    catch(e){ if(att===2) throw e; log('⚠ '+t('jsonRetry')+' ('+(att+1)+'/2)','err'); await sleep(300); }
  }
  if(!parsed.year) parsed.year=state.scenario.start+sim.idx*state.scenario.step;
  if(!parsed.events) parsed.events=[];
  if(!parsed.factions||!parsed.factions.length) parsed.factions=sim.factions;
  if(!parsed.map) parsed.map=[];
  ensureColors(sim, parsed.factions);
  return parsed;
}

/* ---------- 分支对比 ---------- */
async function runBranches(){
  saveApi(); readScenario();
  if(!state.api.base||!state.api.model){ toast(t('noApi')); return; }
  const n=Math.min(4,Math.max(2,parseInt($('branchN').value)||3));
  state.branches=[];
  $('btnBranch').disabled=true;
  log('▶ 分支对比 x'+n,'info');
  for(let b=0;b<n;b++){
    const sim={turns:[],factions:[],year:state.scenario.start,idx:0,running:false,paused:false,factionColors:{}};
    const seed=Math.random().toString(36).slice(2,8);
    $('branchText').textContent='分支 '+(b+1)+'/'+n+' 推演中… (seed '+seed+')';
    for(let i=0;i<totalSteps();i++){
      try{ const turn=await genTurn(sim,LANG,'#'+seed); sim.turns.push(turn); if(turn.factions&&turn.factions.length) sim.factions=turn.factions; sim.idx++; sim.year=state.scenario.start+sim.idx*state.scenario.step; }
      catch(e){ log('分支'+(b+1)+' 失败: '+e.message,'err'); break; }
    }
    state.branches.push({sim,seed});
    saveRun();
    $('branchBar').style.width=Math.round((b+1)/n*100)+'%';
    log('✓ 分支 '+(b+1)+' 完成','ok');
  }
  $('btnBranch').disabled=false; $('branchText').textContent='完成 '+n+' 个分支';
  renderBranches();
}
/* ---------- 分歧度计算（数值 45% + 领土 30% + 综述文本 25%） ---------- */
function textSim(a,b){
  const grams=s=>{
    const str=String(s==null?'':s).toLowerCase().replace(/\s+/g,'');
    const arr=[]; if(!str.length) return arr;
    for(let i=0;i<str.length-1;i++) arr.push(str.slice(i,i+2));
    if(str.length===1) arr.push(str);
    return arr;
  };
  const A=new Set(grams(a)), B=new Set(grams(b));
  if(!A.size||!B.size) return 0;
  let inter=0; A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter/(A.size+B.size-inter);
}
function branchDivergence(){
  const bs=state.branches||[];
  const steps=totalSteps();
  const out=[];
  for(let i=0;i<steps;i++){
    const year=state.scenario.start+(i+1)*state.scenario.step;
    const turns=[]; bs.forEach(b=>{ if(b.sim.turns[i]) turns.push(b.sim.turns[i]); });
    if(turns.length<2){ out.push({i:i,year:year,score:0,num:0,map:0,txt:0,mapDiff:0,ok:false}); continue; }
    /* 势力数值差异：各势力 tech/military/stability 的极差，60 分视为满分 */
    const ids={}; turns.forEach(tr=>(tr.factions||[]).forEach(f=>{ if(f&&f.id) ids[f.id]=1; }));
    let numSum=0,numCnt=0;
    Object.keys(ids).forEach(id=>{
      ['tech','military','stability'].forEach(m=>{
        const vals=[];
        turns.forEach(tr=>{ const f=(tr.factions||[]).find(x=>x.id===id); const v=f?Number(f[m]):NaN; if(!isNaN(v)) vals.push(v); });
        if(vals.length<2) return;
        numSum+=Math.min(1,(Math.max.apply(null,vals)-Math.min.apply(null,vals))/60); numCnt++;
      });
    });
    const num=numCnt?numSum/numCnt:0;
    /* 领土控制差异：12 地区中控制者不一致的比例 */
    let mapDiff=0,mapCnt=0;
    REGIONS.forEach(r=>{
      const cs=[]; turns.forEach(tr=>{ const m=(tr.map||[]).find(x=>x.region===r.id); if(m&&m.faction) cs.push(m.faction); });
      if(cs.length<2) return;
      mapCnt++; if(new Set(cs).size>1) mapDiff++;
    });
    const map=mapCnt?mapDiff/mapCnt:0;
    /* 综述文本差异：二元组 Jaccard 相似度的补 */
    const sums=turns.map(tr=>tr.summary||'');
    let txt=0,tc=0;
    for(let a=0;a<sums.length;a++) for(let b=a+1;b<sums.length;b++){ txt+=1-textSim(sums[a],sums[b]); tc++; }
    txt=tc?txt/tc:0;
    out.push({i:i,year:year,score:0.45*num+0.30*map+0.25*txt,num:num,map:map,txt:txt,mapDiff:mapDiff,ok:true});
  }
  return out;
}
function renderBranches(){
  const el=$('branchView'); if(!el) return;
  if(!state.branches||!state.branches.length){ el.innerHTML='<div class="empty">'+t('branchEmpty')+'</div>'; return; }
  const steps=totalSteps();
  const div=branchDivergence();
  /* 峰值年：累积分歧最大；起点年：相较上一年增幅最大的转折年 */
  let peak=-1, onset=-1, onsetDelta=0;
  div.forEach(d=>{ if(!d.ok) return; if(peak<0||d.score>div[peak].score) peak=d.i; });
  for(let i=1;i<div.length;i++){
    if(!div[i].ok||!div[i-1].ok) continue;
    const dl=div[i].score-div[i-1].score;
    if(dl>onsetDelta){ onsetDelta=dl; onset=i; }
  }
  const hasPeak=peak>=0&&div[peak].score>0.001;
  const hasOnset=onset>=0&&onsetDelta>0.02&&onset!==peak;
  let html='';
  html+='<div style="margin-bottom:8px"><button class="btn sm ghost" id="branchCsvBtn" onclick="exportBranchCsv()">'+t('branchCsv')+'</button></div>';
  if(hasPeak){
    const p=div[peak];
    html+='<div class="peakbox"><div><strong>⚡ '+t('branchPeak')+'：'+p.year+'</strong>'+
      '<span class="muted"> · '+t('branchScore')+' '+p.score.toFixed(2)+'</span></div>'+
      '<div class="muted" style="margin-top:3px">'+t('branchWhyNum')+' '+p.num.toFixed(2)+
      ' · '+t('branchWhyMap')+' '+p.map.toFixed(2)+' ('+p.mapDiff+'/12)'+
      ' · '+t('branchWhyTxt')+' '+p.txt.toFixed(2)+'</div>'+
      (hasOnset?'<div class="muted" style="margin-top:3px">↯ '+t('branchOnset')+'：'+div[onset].year+
        '（'+t('branchScore')+' +'+onsetDelta.toFixed(2)+'）</div>':'')+'</div>';
  }else{
    html+='<div class="muted" style="margin-bottom:8px">'+t('branchNoDiv')+'</div>';
  }
  html+='<div class="muted" style="margin-bottom:8px">每一行是一个推演年份，并排展示各分支的综述；「'+t('branchDivCol')+'」列自动计算各分支在该年的差异程度，最高者已高亮。</div>';
  html+='<table><thead><tr><th>年份</th><th>'+t('branchDivCol')+'</th>'+state.branches.map((br,i)=>'<th>分支 '+(i+1)+'<br><span class="muted">seed '+br.seed+'</span></th>').join('')+'</tr></thead><tbody>';
  for(let i=0;i<steps;i++){
    const yr=state.scenario.start+(i+1)*state.scenario.step;
    const d=div[i]||{score:0,ok:false};
    const cell='<div class="divbar"><i style="width:'+Math.round(Math.min(1,d.score)*100)+'%"></i></div><span class="muted">'+(d.ok?d.score.toFixed(2):'—')+'</span>';
    const isPeak=hasPeak&&peak===i;
    const isOnset=hasOnset&&onset===i;
    const cls=isPeak?'peakrow':(isOnset?'onsetrow':'');
    const marks=(isPeak?'<br><span class="badge">⚡ '+t('branchPeak')+'</span>':'')+
      (isOnset?'<br><span class="badge alt">↯ '+t('branchOnset')+'</span>':'');
    html+='<tr class="'+cls+'"><td><strong>'+yr+'</strong>'+marks+'</td><td>'+cell+'</td>'+state.branches.map(br=>{
      const tr=br.sim.turns[i]; if(!tr) return '<td class="muted">—</td>';
      const dv=(tr.divergences||[]).length?'<div class="muted" style="margin-top:4px">⚡ '+escapeHtml((tr.divergences||[]).join('；'))+'</div>':'';
      return '<td style="vertical-align:top"><div>'+escapeHtml(tr.summary||'')+'</div>'+dv+'</td>';
    }).join('')+'</tr>';
  }
  html+='</tbody></table>';
  html+='<h3 style="margin-top:16px">'+t('branchFinal')+'</h3>';
  html+='<table><thead><tr><th>势力</th>'+state.branches.map((br,i)=>'<th>分支'+(i+1)+'</th>').join('')+'</tr></thead><tbody>';
  const f0=state.branches[0].sim.factions||[];
  f0.forEach(f=>{
    html+='<tr><td><strong>'+escapeHtml(f.name||'')+'</strong></td>'+state.branches.map(br=>{
      const ff=(br.sim.factions||[]).find(x=>x.id===f.id)||{};
      return '<td>'+((ff.tech!=null)?ff.tech:'-')+' / '+((ff.military!=null)?ff.military:'-')+' / '+((ff.stability!=null)?ff.stability:'-')+'</td>';
    }).join('')+'</tr>';
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

function factionColor(sim,fid){
  if(!fid||fid==='independent'||fid==='none') return '#cfd8e3';
  return (sim.factionColors&&sim.factionColors[fid])||'#7c5cff';
}
function factionName(sim,fid){
  if(!fid) return t('mapNone');
  if(fid==='independent'||fid==='none') return t('mapIndep');
  let f=(sim.factions||[]).find(x=>x.id===fid);
  if(!f){ // 回退：从任意回合的 factions 里反查，避免导入数据后只显示 id
    for(let i=(sim.turns||[]).length-1;i>=0;i--){
      const g=((sim.turns[i].factions)||[]).find(x=>x.id===fid);
      if(g){ f=g; break; }
    }
  }
  return f? (f.name||fid) : fid;
}

function renderTrend(metric){
  const el=$('trendView'); if(!el) return;
  const turns=state.sim.turns;
  if(turns.length<1){ el.innerHTML='<div class="empty">'+t('trendEmpty')+'</div>'; return; }
  const colors=state.sim.factionColors;
  const ids=Object.keys(colors);
  const all=(metric==='all');
  const metrics=all?['tech','military','stability']:[metric];
  const DASH={tech:'',military:'7 4',stability:'2 4'}; // 线型区分指标：实线=科技、虚线=军力、点线=稳定
  const series={}; ids.forEach(id=>{ series[id]={}; metrics.forEach(m=>series[id][m]=[]); });
  turns.forEach(tr=>{
    const fmap={}; (tr.factions||[]).forEach(f=>fmap[f.id]=f);
    ids.forEach(id=>{ const f=fmap[id]||{}; metrics.forEach(m=>{ series[id][m].push({year:tr.year, v:(f[m]!=null)?Number(f[m]):null}); }); });
  });
  const years=turns.map(x=>x.year);
  const minY=Math.min.apply(null,years), maxY=Math.max.apply(null,years);
  const W=680,H=320,pad=42;
  const xOf=y=> pad + (maxY>minY? (y-minY)/(maxY-minY)*(W-2*pad):0);
  const yOf=v=> H-pad - (v/100)*(H-2*pad);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  svg+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff"/>';
  for(let g=0;g<=100;g+=20){ svg+='<line x1="'+pad+'" y1="'+yOf(g)+'" x2="'+(W-pad)+'" y2="'+yOf(g)+'" stroke="#eef2f7"/><text x="6" y="'+(yOf(g)+3)+'" font-size="9" fill="#667085">'+g+'</text>'; }
  years.forEach(y=> svg+='<text x="'+xOf(y)+'" y="'+(H-16)+'" font-size="9" fill="#667085" text-anchor="middle">'+y+'</text>');
  ids.forEach(id=> metrics.forEach(m=>{
    const pts=series[id][m].filter(p=>p.v!=null).map(p=>xOf(p.year)+','+yOf(p.v)).join(' ');
    if(pts) svg+='<polyline points="'+pts+'" fill="none" stroke="'+colors[id]+'" stroke-width="2"'+(DASH[m]?' stroke-dasharray="'+DASH[m]+'"':'')+'/>';
  }));
  svg+='</svg>';
  let leg='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center">';
  ids.forEach(id=>{ const f=state.sim.factions.find(x=>x.id===id); if(f) leg+='<span class="tag" style="background:'+colors[id]+'">'+escapeHtml(f.name)+'</span>'; });
  if(all){
    const ML={tech:'fTech',military:'fMil',stability:'fStab'};
    leg+='<span class="muted" style="margin-left:10px">'+t('trendAll')+'</span>';
    ['tech','military','stability'].forEach(m=>{
      leg+='<span style="display:inline-flex;align-items:center;gap:4px"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#475569" stroke-width="2"'+(DASH[m]?' stroke-dasharray="'+DASH[m]+'"':'')+'/></svg>'+escapeHtml(t(ML[m]))+'</span>';
    });
  }
  leg+='</div>';
  el.innerHTML=svg+leg;
}

  const steps=totalSteps();

  state.branches.forEach((b,i)=>head.push('branch'+(i+1)+' (seed '+b.seed+')'));
  rows.push(head);
  for(let i=0;i<steps;i++){
    const yr=state.scenario.start+(i+1)*state.scenario.step;
    const row=[yr, (div[i]&&div[i].ok)?div[i].score.toFixed(3):''];
    state.branches.forEach(b=>{ const tr=b.sim.turns[i]; row.push(tr?(tr.summary||''):'' ); });
    rows.push(row);
  }
  const f0=state.branches[0].sim.factions||[];
  if(f0.length){
    rows.push([]);
    rows.push([t('fName')].concat(state.branches.map((b,i)=>'branch'+(i+1)+' '+t('fTech')+'/'+t('fMil')+'/'+t('fStab'))));
    f0.forEach(f=>{
      const row=[f.name||f.id];
      state.branches.forEach(b=>{
        const ff=(b.sim.factions||[]).find(x=>x.id===f.id)||{};
        row.push(((ff.tech!=null)?ff.tech:'-')+'/'+((ff.military!=null)?ff.military:'-')+'/'+((ff.stability!=null)?ff.stability:'-'));
      });
      rows.push(row);
    });
  }
  const csv='\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='alt-history-branches-'+Date.now()+'.csv'; a.click();
  toast(t('branchCsv')+' OK');
}

}
/* ---------- 导出 Markdown 报告 ---------- */
function exportReport(){
  if(!state.sim.turns.length){ toast(t('tlEmpty')); return; }
  const doms=t('domains')||{};
  let md='# '+(state.scenario.title||'Alternate History')+'\n\n';
  md+='- '+t('lStart')+': '+state.scenario.start+'\n- '+t('lEnd')+': '+state.scenario.end+'\n- '+t('lStep')+': '+state.scenario.step+'\n\n';
  md+='## '+t('lBase')+'\n\n'+(state.scenario.base||'')+'\n\n';
  md+='## '+t('tNodes')+'\n\n'+(state.scenario.nodes.map(n=>'- **'+n.year+' · '+n.name+'** — '+n.desc).join('\n')||'-')+'\n\n';
  md+='## '+t('tabTimeline')+'\n\n';
  state.sim.turns.forEach(tr=>{
    md+='### '+tr.year+'\n\n'+(tr.summary||'')+'\n\n';
    (tr.events||[]).forEach(e=>{
      md+='- **['+((doms[e.domain]||e.domain))+'] '+(e.title||'')+'** — '+(e.description||'')+(e.severity?('（'+e.severity+'/5）'):'')+'\n';
    });
    if(tr.divergences&&tr.divergences.length) md+='\n> ⚡ '+tr.divergences.join(' / ')+'\n';
    md+='\n';
  });
  md+='## '+t('tabFactions')+'\n\n';
  md+='| '+t('fName')+' | '+t('fIdeo')+' | '+t('fLeader')+' | '+t('fGdp')+' | '+t('fStab')+' | '+t('fMil')+' | '+t('fTech')+' | '+t('fPop')+' |\n';
  md+='|---|---|---|---|---|---|---|---|\n';
  state.sim.factions.forEach(f=>{
    md+='| '+[f.name,f.ideology,f.leader,f.gdp,f.stability,f.military,f.tech,f.population].map(x=>(x==null||x==='')?'-':x).join(' | ')+' |\n';
  });
  if(state.branches&&state.branches.length){
    const div=branchDivergence();
    md+='\n## '+t('tabBranch')+'\n\n';
    md+='| '+t('mapYear')+' | '+t('branchDivCol')+' |\n|---|---|\n';
    div.forEach(d=>{ if(d.ok) md+='| '+d.year+' | '+d.score.toFixed(3)+' |\n'; });
    md+='\n| '+t('fName')+' | '+state.branches.map((b,i)=>'B'+(i+1)+' ('+t('fTech')+'/'+t('fMil')+'/'+t('fStab')+')').join(' | ')+' |\n';
    md+='|---|'+state.branches.map(()=>'---|').join('')+'\n';
    (state.branches[0].sim.factions||[]).forEach(f=>{
      md+='| '+f.name+' | '+state.branches.map(b=>{
        const ff=(b.sim.factions||[]).find(x=>x.id===f.id)||{};
        return ((ff.tech!=null)?ff.tech:'-')+'/'+((ff.military!=null)?ff.military:'-')+'/'+((ff.stability!=null)?ff.stability:'-');
      }).join(' | ')+' |\n';
    });
  }
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='alt-history-report-'+Date.now()+'.md'; a.click();
  toast(t('btnReport')+' OK');
}

$('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{
    try{ const o=JSON.parse(r.result);
      if(o.scenario){ Object.assign(state.scenario,o.scenario); fillScenarioForm(); }
      if(o.sim){ state.sim=o.sim; state.sim.factionColors=state.sim.factionColors||{}; }
      if(o.branches){ state.branches=o.branches.map(b=>({seed:b.seed,sim:b.sim})); renderBranches(); }
      refreshViews(); toast(t('imported')); }catch(err){ toast('JSON 错误'); }
  }; r.readAsText(f); e.target.value='';
});
function fillScenarioForm(){
  $('scnTitle').value=state.scenario.title||''; $('startYear').value=state.scenario.start;
  $('endYear').value=state.scenario.end; $('stepYears').value=state.scenario.step;
  $('baseContext').value=state.scenario.base||''; renderNodes();
}

document.querySelectorAll('.tab').forEach(tab=>{

    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

    if(tab.dataset.view==='raw') renderRaw();
    if(tab.dataset.view==='map') renderMap();

/* ---------- 启动 ---------- */
(function init(){
  loadApi();
  try{ const s=JSON.parse(localStorage.getItem('ahs_scenario')||'null'); if(s) Object.assign(state.scenario,s); }catch(e){}
  $('lang').value=LANG; applyLang(); fillScenarioForm();
  /* 断点续跑：恢复上次推演存档 */
  try{
    const r=JSON.parse(localStorage.getItem('ahs_run')||'null');
    if(r&&r.sim&&r.sim.turns&&r.sim.turns.length){
      if(r.scenario&&r.scenario.nodes) state.scenario=r.scenario;
      state.sim=Object.assign({turns:[],factions:[],year:null,idx:0,running:false,paused:false,factionColors:{}},r.sim);
      state.sim.running=false; state.sim.paused=false;
      state.branches=(r.branches||[]).map(b=>({seed:b.seed,sim:b.sim}));
      fillScenarioForm(); refreshViews(); renderRaw();
      const pct=Math.round(state.sim.idx/Math.max(1,totalSteps())*100);
      $('progBar').style.width=pct+'%';
      $('progText').textContent=state.sim.idx+'/'+totalSteps();
      toast(t('runRestored').replace('{n}',state.sim.turns.length));
    }
  }catch(e){}
})();
